[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brvm-mcp"
version = "0.1.0"
description = "Serveur MCP BRVM : un assistant IA interroge cours, dividendes, fondamentaux et risque des actions de la BRVM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NDOUDY-BAMOUENIZO Dylane Emmanuel Reyane" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "pandas>=1.5",
    "numpy>=1.23",
    "brvm-py @ git+https://github.com/DylaneTrader/brvm-py",
]
keywords = ["brvm", "mcp", "llm", "claude", "uemoa", "finance", "risque"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.scripts]
brvm-mcp = "brvm_mcp.serveur:main"

[project.urls]
Homepage = "https://github.com/DylaneTrader/brvm-mcp"
Donnees = "https://github.com/DylaneTrader/brvm-py"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/brvm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
