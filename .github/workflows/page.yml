name: Page publique

# Recalcule la page de présentation (séance du jour vue par les outils du serveur) et la publie sur
# GitHub Pages : https://dylanetrader.github.io/brvm-mcp/
# Prérequis, une seule fois : Settings > Pages > Source : « GitHub Actions ».

on:
  schedule:
    - cron: "57 19 * * 1-5"     # après la mise à jour des données de brvm-py
  push:
    branches: [main]
    paths: ["page/**", "src/**", ".github/workflows/page.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install .
      # Chat de la page : roues Python chargées par Pyodide dans le navigateur du visiteur…
      - run: pip wheel --no-deps -w site/paquets . "brvm-py @ git+https://github.com/DylaneTrader/brvm-py"
      # … et SDK TypeScript d'Anthropic mis en un seul module (versions figées).
      - name: SDK Anthropic pour le navigateur
        run: |
          mkdir -p /tmp/sdk site/vendor
          cd /tmp/sdk
          npm init -y > /dev/null
          npm install --no-audit --no-fund @anthropic-ai/sdk@1.7.0 esbuild@0.28.2
          echo 'export { default } from "@anthropic-ai/sdk"; export * from "@anthropic-ai/sdk";' > entree.mjs
          npx esbuild entree.mjs --bundle --format=esm --platform=browser --minify --outfile="$GITHUB_WORKSPACE/site/vendor/anthropic.mjs"
      - run: python page/publier.py --sortie site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deployer:
    needs: construire
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
